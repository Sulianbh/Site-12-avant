# ---------------------------------------------------------------------
# PASUPA — le site AVANT (n° 12). Mise en ligne sur Netlify.
#
# C'est le « avant » d'une démonstration avant/après. Il est laid
# volontairement, et il porte le même contenu fictif que le site fini.
# ---------------------------------------------------------------------

[build]
  # Pas de substitution d'origine ici, contrairement aux sites finis :
  # ce site ne déclare aucune canonique, aucun plan de site, aucune
  # donnée structurée et aucune image de partage. C'est précisément un
  # des points de la démonstration, et il n'y a donc rien à nommer.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Un déploiement par API n'installe pas le runtime Next tout seul, à la
# différence d'un projet relié à git. Sans cette déclaration, `.next` est
# publié comme un dossier statique brut et la racine répond 404 alors
# que le déploiement se dit réussi.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------
# Le site est servi en `X-Robots-Tag: noindex, nofollow` depuis
# `next.config.ts`, sans variable pour le lever. Une page volontairement
# ratée qui porte le nom PASUPA n'a aucune raison de remonter dans un
# moteur de recherche.
# ---------------------------------------------------------------------
